[package]
name = "pds"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atrium-repo = "0.1.8"
cid = "0.11.3"
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.6.4"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.7" }
worker-macros = { version = "0.7" }
