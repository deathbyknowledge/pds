name = "gsv-pds"
main = "build/index.js"
compatibility_date = "2026-04-22"
workers_dev = true

[vars]
PDS_LEXICON_AUTHORITY_DIDS = "gsv.app=did:web:gsv-pds.stevej.workers.dev"
PDS_ALLOWED_ACCOUNT_HANDLE_SUFFIXES = "gsv.dev"

[build]
command = "worker-build --release ."

[durable_objects]
bindings = [
  { name = "REPO_OBJECTS", class_name = "RepoObject" },
  { name = "DIRECTORY_OBJECTS", class_name = "PdsDirectoryObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PdsDirectoryObject"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
