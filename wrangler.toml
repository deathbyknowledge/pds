name = "gsv-pds"
main = "build/index.js"
compatibility_date = "2026-04-22"
workers_dev = false

[build]
command = "worker-build --release ."

[durable_objects]
bindings = [
  { name = "REPO_OBJECTS", class_name = "RepoObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoObject"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
